<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" role="img" aria-label="Loading">
  <style>
    .gl-spinner-ring {
      transform-origin: 22px 22px;
      animation: gl-spin 1.15s linear infinite;
    }
    .gl-spinner-node {
      transform-origin: 22px 22px;
      animation: gl-spin 1.15s linear infinite, gl-pulse 1.15s linear infinite;
    }
    @keyframes gl-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes gl-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gl-spinner-ring, .gl-spinner-node {
        animation: gl-pulse 1.6s ease-in-out infinite;
      }
    }
  </style>

  <!-- three trailing arcs: consensus ring, fading like validator signal decay -->
  <g class="gl-spinner-ring">
    <path d="M22 6 A16 16 0 0 1 36.14 14"
          fill="none" stroke="#110FFF" stroke-width="4.2"
          stroke-linecap="round" opacity="1" />
    <path d="M38.5 20 A16 16 0 0 1 33 34.7"
          fill="none" stroke="#110FFF" stroke-width="4.2"
          stroke-linecap="round" opacity="0.5" />
    <path d="M28.6 37.6 A16 16 0 0 1 9.4 30.6"
          fill="none" stroke="#110FFF" stroke-width="4.2"
          stroke-linecap="round" opacity="0.22" />
  </g>

  <!-- leading node: the "confirming" validator, pulses like a settled consensus -->
  <g class="gl-spinner-node">
    <circle cx="22" cy="6" r="3.1" fill="#00FF66" />
  </g>
</svg>
